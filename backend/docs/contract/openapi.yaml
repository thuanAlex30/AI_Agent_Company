  /api/purchase-orders/{id}/receive: {post: {}}
  /api/suppliers: {get: {}, post: {}}
  /api/shipments: {get: {}, post: {}}
  /api/shipments/{id}: {patch: {}}
  /api/qa-checks: {get: {}, post: {summary: "Validate ref_id ton tai theo ref_type (order/shipment/product)"}}
  /api/sop-tasks: {get: {}, post: {}}
  /api/transactions: {get: {}, post: {}}
  /api/transactions/import-csv: {post: {summary: "Dem imported/skipped theo changes; phan biet duplicate vs invalid (P2-20)"}}
  /api/reconcile/run: {post: {}}
  /api/debts: {get: {}, post: {}}
  /api/debts/{id}/remind: {post: {}}
  /api/debts/remind-all: {post: {description: US-FIN-02 1 click}}
  /api/payments: {post: {parameters: [Idempotency-Key], summary: "Khoa dong cong no truoc khi ghi (anti lost-update)"}}
  /api/expenses: {get: {}, post: {summary: "Cap duyet tinh tu approval-matrix.json (khong hardcode nguong)"}}
  /api/finance/kpis: {get: {}}
  /api/finance/cashflow: {get: {tags: [finance], summary: "Cashflow theo ngay (SQL portable 2 dialect)", responses: {'200': {description: rows}}}}
  /api/reminders: {get: {}}
  /api/budgets: {get: {}, post: {}}
  /api/employees: {get: {}, post: {}}
  /api/attendance/checkin: {post: {}}
  /api/attendance/checkout: {post: {}}
  /api/hr/today: {get: {}}
