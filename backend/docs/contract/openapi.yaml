openapi: 3.0.3
info: {title: BizOps AI v8.1, version: 11.1.0, description: "Contract API — nguon su that cho FE/agent. Phase 3: scope v2 server-side; Phase 4: state machine + tx + audit; Phase 5: refresh queue + CSRF; Phase 6: container hardening + observability."}
servers: [{url: http://localhost:3000}]

# ---------------------------------------------------------------------------
# SECURITY (Phase 2 + 5)
#   - Cookie session: `access_token` (httpOnly, 30p) + `refresh_token` (httpOnly, 7d)
#   - Moi MUTATION (POST/PUT/PATCH/DELETE) can header `X-CSRF-Token` khop cookie
#     `csrf_token` (double-submit, KHONG httpOnly). Exception: /api/public/*,
#     /api/auth/login, /api/auth/refresh, va request kem `Authorization: Bearer`.
#   - Pham vi du lieu theo phong ban: server-side, fail-closed. Response co
#     header `X-Scope-Depts` (ALL hoac danh sach ma phong ban).
#   - `X-Request-Id` tra ve cho moi request (dung de truy vet log).
# ---------------------------------------------------------------------------
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - {name: auth, description: "Dang nhap / refresh / quan ly phien"}
  - {name: scope, description: "Khoi tong hop theo phong ban"}
  - {name: finance, description: "Cong no, thanh toan, ke toan"}

paths:
  /api/health: {get: {tags: [auth], summary: "Liveness + version (config.APP_VERSION)", responses: {'200': {description: ok}}}}
  /api/ready: {get: {tags: [auth], summary: "Readiness — DB (bat buoc) + agent (checks.agent, degraded neu agent offline)", responses: {'200': {description: ready}, '503': {description: not_ready}}}}
  /api/auth/login: {post: {tags: [auth], summary: "Dang nhap — tra access + refresh + csrf_token; set cookie httpOnly", responses: {'200': {description: jwt + csrf_token}, '401': {description: AUTH}}}}
  /api/auth/refresh: {post: {tags: [auth], summary: "Xoay vong refresh token (atomic). Token cu bi thu hoi => 401 + thu hoi TOAN BO phien (reuse detection)", responses: {'200': {description: rotate + csrf_token moi}, '401': {description: AUTH (het han / reuse)}}}}
  /api/auth/logout: {post: {tags: [auth], summary: "Thu hoi phien hien tai", responses: {'200': {description: revoked}}}}
  /api/auth/logout-all: {post: {tags: [auth], summary: "Thu hoi TOAN BO phien cua user (dung khi doi mat khau)", responses: {'200': {description: revoked_all}}}}
  /api/auth/change-password: {post: {tags: [auth], summary: "Doi mat khau chinh user (can old_password + policy chu+so>=8); xong tang auth_version + thu hoi TOAN BO session + clear cookie", responses: {'200': {description: changed}, '400': {description: VALIDATION}, '401': {description: AUTH}}}}
  /api/auth/sessions: {get: {tags: [auth], summary: "Danh sach phien dang mo (CHI cua chinh user)", responses: {'200': {description: sessions}}}}
  /api/auth/sessions/{id}: {delete: {tags: [auth], summary: "Thu hoi 1 phien", responses: {'200': {description: revoked}, '404': {description: NOT_FOUND}}}}
  /api/auth/me: {get: {tags: [auth, scope], summary: "User hien tai + permissions + scope (dept_code, depts, all_depts)", responses: {'200': {description: user + permissions + scope}}}}
  /api/customers: {get: {}, post: {}}
  /api/customers/{id}: {get: {}, patch: {}}
  /api/leads: {get: {}, post: {}}
  /api/leads/{id}/convert: {post: {}}
  /api/quotes: {get: {}, post: {}}
  /api/contracts: {get: {}, post: {}}
  /api/contracts/{id}/submit-approval: {post: {summary: "Cap duyet tinh tu approval-matrix.json; co cap bo sung legal neu contract_extra_legal khop"}}
  /api/orders: {get: {}, post: {parameters: [Idempotency-Key]}}
  /api/orders/{id}/cancel: {post: {summary: "Chi cancel khi chuyen trang thai hop le (ORDER_FLOW) va CHUA co payment"}}
  /api/orders/{id}/refund: {post: {summary: "Chi refund tu paid/partial (ORDER_FLOW)"}}
  /api/sales/kpi: {get: {}}
  /api/campaigns: {get: {}, post: {}}
  /api/marketing/roi: {get: {}}
  /api/products: {get: {}, post: {}}
