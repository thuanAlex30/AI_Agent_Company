  /api/agent/brief: {get: {tags: [scope], summary: "Brief dang markdown cho AI agent; tra header X-Scope-Depts", responses: {'200': {description: markdown}}}}
  /api/approvals: {get: {}, post: {summary: "Cap duyet LUON tinh tu matrix; client KHONG duoc ep cap (400)"}}
  /api/approvals/{id}/decide: {post: {summary: "Khoa dong + conditional update chong double-decide"}}
  /api/audit: {get: {summary: "Chi tra audit cua ban ghi TRONG phong ban minh"}}
  /api/risks: {get: {}, post: {}}
  /api/it-incidents: {get: {}, post: {}}
  /api/it-incidents/{id}: {patch: {summary: "Chuyen trang thai theo IT_FLOW; sai => 400"}}
  /api/it/health: {get: {}}
  /api/product-features: {get: {}, post: {}}
  /api/users: {get: {}, post: {}}
  /api/users/{id}/unlock: {post: {}}
  /api/public/products: {get: {description: US-STOREFRONT-01 catalog public (published only, stock dang in/out, khong lo cost/ton so)}}
  /api/public/products/{slug}: {get: {description: US-STOREFRONT-01 chi tiet + combo_items}}
  /api/public/services: {get: {description: US-STOREFRONT-01 dich vu public}}
  /api/public/services/{id}: {get: {description: US-STOREFRONT-01 chi tiet dich vu}}
  /api/public/banners: {get: {description: US-STOREFRONT-01 hero carousel}}
  /api/public/promotions: {get: {description: US-STOREFRONT-01 khuyen mai active}}
  /api/public/orders: {post: {description: US-STOREFRONT-02 checkout (gia server + combo explode + idempotency + dat truoc ton kho atomic), parameters: [Idempotency-Key]}}
  /api/public/service-requests: {post: {description: US-STOREFRONT-02 dat lich teabreak chi tiet (slot/party/location/MST)}}
  /api/public/orders/{code}: {get: {description: US-STOREFRONT-03 tra cuu 2 yeu to (ma + SDT/email hoac X-Lookup-Token), parameters: [contact, X-Lookup-Token]}}
  /api/public/payments/webhook: {post: {description: US-STOREFRONT-03 webhook VietQR tinh (HMAC + replay + idempotency), parameters: [x-signature, x-timestamp]}}
  /api/public/chat: {post: {description: US-STOREFRONT-04 chat public proxy sang agent_svc /public-chat}}

components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: access_token}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Idempotency-Key: {name: Idempotency-Key, in: header, required: false, schema: {type: string}, description: "Khoa chong ghi trung; GIU NGUYEN qua vong retry (FE)"}
    X-CSRF-Token: {name: X-CSRF-Token, in: header, required: false, schema: {type: string}, description: "Khop voi cookie csrf_token (double-submit). Bat buoc cho moi mutation dung cookie session."}
    X-Scope-Depts: {name: X-Scope-Depts, in: header, required: false, schema: {type: string}, description: "RESPONSE: pham vi du lieu server-side quyet dinh (ALL hoac danh sach ma phong ban)"}
    X-Request-Id: {name: X-Request-Id, in: header, required: false, schema: {type: string}, description: "RESPONSE: id truy vet log ([rid=...])"}
    X-Lookup-Token: {name: X-Lookup-Token, in: header, required: false, schema: {type: string}, description: "Token tra cuu don (thay the SDT/email)"}
    contact: {name: contact, in: query, required: false, schema: {type: string}, description: "SDT hoac email de tra cuu don"}
    x-signature: {name: x-signature, in: header, required: false, schema: {type: string}}
    x-timestamp: {name: x-timestamp, in: header, required: false, schema: {type: string}}
  responses:
    Forbidden: {description: "FORBIDDEN — ngoai scope phong ban / thieu quyen / CSRF token khong hop le"}
    Conflict: {description: "CONFLICT — bi cap nhat boi giao dich khac (conditional update that bai)"}
    NotFound: {description: "NOT_FOUND"}
