server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Gzip (bat buoc cho Lighthouse/Perf) ---
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss application/rss+xml
    image/svg+xml font/woff font/woff2 application/vnd.ms-fontobject
    application/x-font-ttf application/octet-stream;

  # --- Bao dong ---
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # --- Static assets: hash -> cache immutable ---
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # --- Fonts: ten on dinh -> cache lau dai ---
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /favicon.svg {
    expires 30d;
    access_log off;
  }

  location = /robots.txt {
    expires 1d;
    access_log off;
  }

  # --- SPA fallback ---
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
