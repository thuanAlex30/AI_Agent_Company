server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Gzip (bat buoc cho Lighthouse/Perf) ---
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss application/rss+xml
    image/svg+xml font/woff font/woff2 application/vnd.ms-fontobject
    application/x-font-ttf application/octet-stream;

  # --- Bao dong ---
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # --- WEB-01: reverse proxy /api -> backend ---
  # Storefront goi API cung origin (BASE='' nen /api/... se tro ve chinh
  # host nay). Truoc day khong co location /api/ => nginx tra index.html
  # (SPA fallback) thay cho JSON => moi loi "Unexpected token <".
  # Proxy giữ nguyên Idempotency-Key va khong tu retry POST.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Khong sua body (webhook HMAC ky tren byte tho).
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # Idempotency-Key phai qua nguyen ven.
    proxy_pass_request_headers on;
    # Response tu backend khong nen cache (du lieu don/dat khong ton tai).
    proxy_no_cache 1;
    proxy_cache_bypass 1;
  }

  # --- Static assets: hash -> cache immutable ---
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # --- Fonts: ten on dinh -> cache lau dai ---
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /favicon.svg {
    expires 30d;
    access_log off;
  }

  location = /robots.txt {
    expires 1d;
    access_log off;
  }

  # --- SPA fallback ---
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
