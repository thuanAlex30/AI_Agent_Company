services:
  # ---------------------------------------------------------------------
  # PostgreSQL 15 — DB production (P0-04 / OPS-01).
  # Volume persistent: `bizops-pgdata`. Khong dung file SQLite trong prod.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    # OPS-01 FIX: publish Postgres ra host de pgAdmin/dev truy cap tu Windows.
    # Local PG (D:\PostgreSQL\18) dang giu 5432 + temp instance giu 5433,
    # nen mac dinh publish 5434 -> 5432 (doi qua PG_PORT_PUBLISH trong .env).
    # Chi bind localhost, khong public ra LAN/internet.
    ports:
      - "127.0.0.1:${PG_PORT_PUBLISH:-5434}:5432"
    environment:
      - POSTGRES_USER=${PG_USER:-bizops}
      - POSTGRES_PASSWORD=${PG_PASSWORD:?dat PG_PASSWORD trong .env truoc khi up}
      - POSTGRES_DB=${PG_DB:-bizops}
    volumes:
      - bizops-pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready -U <user> -d <db>: chi bao ready khi server accept truy van.
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-bizops} -d ${PG_DB:-bizops}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------
  # Release job: chay migration + seed (chi 1 lan theo release).
  # Khong chay migration tu dong trong moi container backend — tranh
  # nhieu instance chay migration cung luc (P0-04 / OPS-01).
  # ---------------------------------------------------------------------
  migrate:
    build: ./backend
    environment:
      - NODE_ENV=production
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-bizops}
      - PG_PASSWORD=${PG_PASSWORD:?dat PG_PASSWORD trong .env truoc khi up}
      - PG_DB=${PG_DB:-bizops}
    command: ["node", "src/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Phase 6 (OPS-05): harden container — drop moi quyen, khong escalate.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build: ./backend
    ports:
      # SEC-03: backend KHONG public truc tiep ra internet.
      # Chi bind localhost; truy cap qua ERP/Storefront/nginx tren may chu.
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-bizops}
      - PG_PASSWORD=${PG_PASSWORD:?dat PG_PASSWORD trong .env truoc khi up}
      - PG_DB=${PG_DB:-bizops}
      - JWT_SECRET=${JWT_SECRET:?dat JWT_SECRET trong .env truoc khi up}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      - AGENT_URL=http://agent:3100
      - AGENT_INTERNAL_KEY=${AGENT_INTERNAL_KEY:?dat AGENT_INTERNAL_KEY trong .env truoc khi up}
      - AGENT_PUBLIC_KEY=${AGENT_PUBLIC_KEY:?dat AGENT_PUBLIC_KEY trong .env truoc khi up}
      - AGENT_INTERNAL_KEY_OLD=${AGENT_INTERNAL_KEY_OLD:-}
      - AGENT_PUBLIC_KEY_OLD=${AGENT_PUBLIC_KEY_OLD:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?dat WEBHOOK_SECRET trong .env truoc khi up}
      # Phase 6 (OPS-05): bien moi truong van hanh.
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - CSRF_ENABLED=${CSRF_ENABLED:-1}
      - ACCESS_TTL=${ACCESS_TTL:-30m}
      - REFRESH_DAYS=${REFRESH_DAYS:-7}
      - MAX_SESSIONS_PER_USER=${MAX_SESSIONS_PER_USER:-5}
      - APP_VERSION=${APP_VERSION:-11.1.0}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      # OPS-03: readiness — kiem tra DB thật, khong chi process con song.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Phase 6 (OPS-05): harden container — drop moi quyen Linux, khong
    # escalate, va filesystem read-only (app khong ghi file nao ngoài ./logs).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  agent:
    build: ./agent_svc
    expose:
      - "3100"
    environment:
      - AGENT_PORT=3100
      - NODE_ENV=production
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-bizops}
      - PG_PASSWORD=${PG_PASSWORD:?dat PG_PASSWORD trong .env truoc khi up}
      - PG_DB=${PG_DB:-bizops}
      - AGENT_INTERNAL_KEY=${AGENT_INTERNAL_KEY:?dat AGENT_INTERNAL_KEY trong .env truoc khi up}
      - AGENT_PUBLIC_KEY=${AGENT_PUBLIC_KEY:?dat AGENT_PUBLIC_KEY trong .env truoc khi up}
      - AGENT_INTERNAL_KEY_OLD=${AGENT_INTERNAL_KEY_OLD:-}
      - AGENT_PUBLIC_KEY_OLD=${AGENT_PUBLIC_KEY_OLD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Phase 6 (OPS-05): harden container giong backend.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ERP noi bo (khong public ra internet — chi bind localhost)
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Storefront public — Nginx proxy /api -> backend (WEB-01).
  storefront:
    build: ./storefront
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # OPS-04: backup job. Image rieng co pg_dump + bash (node:20-alpine
  # mac dinh khong co). Chay theo schedule, luu vao volume persistent
  # `bizops-backups` (khong nam trong writable layer cua container).
  # ---------------------------------------------------------------------
  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-bizops}
      - PG_PASSWORD=${PG_PASSWORD:?dat PG_PASSWORD trong .env truoc khi up}
      - PG_DB=${PG_DB:-bizops}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
    volumes:
      - bizops-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bizops-pgdata:
  bizops-backups:
